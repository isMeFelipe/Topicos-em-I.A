<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Match Predictor</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container mt-5">
    <h1 class="text-center mb-4">💘 Sistema de Compatibilidade</h1>
    <div class="d-grid gap-3 col-6 mx-auto">
      <a href="/criar_perfil" class="btn btn-primary btn-lg">👤 Criar Meu Perfil</a>
      <form action="/ver_matches" method="get">
        <div class="input-group">
          <input type="number" class="form-control" name="user_id" placeholder="Digite seu ID para ver matches" required>
          <button class="btn btn-success" type="submit">🔍 Ver Matches</button>
        </div>
      </form>
    </div>
  </div>
</body>
</html>
