<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Criar Perfil</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container mt-5">
    <h2 class="text-center mb-4">👤 Criar Novo Perfil</h2>

    <form method="POST" class="bg-white p-4 rounded shadow-sm">
      <div class="row g-3">
        {% for campo, opcoes in mapeamentos.items() %}
        <div class="col-md-6">
          <label for="{{ campo }}" class="form-label">
            {{ rotulos[campo] if campo in rotulos else campo.replace('_', ' ').title() }}
          </label>
          <select class="form-select" name="{{ campo }}" id="{{ campo }}" required>
            <option disabled selected value="">Selecione...</option>
            {% for opcao in opcoes %}
            <option value="{{ loop.index0 }}">{{ opcao }}</option>
            {% endfor %}
          </select>
        </div>
        {% endfor %}
      </div>

      <div class="mt-4 text-end">
        <button type="submit" class="btn btn-primary">Salvar Perfil</button>
        <a href="/" class="btn btn-secondary">Cancelar</a>
      </div>
    </form>
  </div>
</body>
</html>
